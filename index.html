    /* ========= 8. P9 DIY 明信片 ========= */
    window.HAILU_P9 = function (app) {
      const cfg = window.HAILU_CONFIG.p9;
      const postcardEl = document.getElementById("p9-postcard");
      const stickersLayer = document.getElementById("postcard-stickers-layer");
      const trayEl = document.getElementById("p9-sticker-tray");
      const drawerEl = document.getElementById("p9-drawer");
      const flashEl = document.getElementById("p9-flash-ripple");

      document.getElementById("p9-title").textContent = cfg.title;
      document.getElementById("p9-tip").textContent = cfg.tip;
      document.getElementById("postcard-fixed-slogan").textContent = cfg.fixedSlogan;
      document.getElementById("postcard-bg-art").innerHTML = `
        <svg viewBox="0 0 360 360" width="100%" height="100%" preserveAspectRatio="none">
          <circle cx="300" cy="64" r="28" fill="#FFB86B" opacity="0.65"/>
          <path d="M0 240 Q90 215 180 240 T360 236 V360 H0 Z" fill="#2CAEE6" opacity="0.6"/>
          <path d="M0 278 Q90 256 180 280 T360 275 V360 H0 Z" fill="#0E87C4" opacity="0.55"/>
        </svg>
        <div style="position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:105px;height:148px">${window.HAILU_SVG.bottle()}</div>
      `;

      trayEl.innerHTML = cfg.stickers.map((st) => `<button class="tray-sticker-btn" data-sticker-id="${st.id}"><div style="width:34px;height:34px">${window.HAILU_SVG.sticker(st.id)}</div><span>${st.name}</span></button>`).join("");

      let zCounter = 10;
      const clearSelection = () => stickersLayer.querySelectorAll(".placed-sticker").forEach((s) => s.classList.remove("is-selected"));
      const applyTransform = (el) => { const s = el._state; el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rot}deg) scale(${s.scale})`; };

      trayEl.querySelectorAll(".tray-sticker-btn").forEach((btn) => btn.addEventListener("click", () => addSticker(btn.dataset.stickerId)));
      document.getElementById("p9-drawer-toggle").addEventListener("click", (e) => {
        e.target.textContent = drawerEl.classList.toggle("is-collapsed") ? "展开贴纸" : "收起";
      });
      postcardEl.addEventListener("pointerdown", (e) => { if (e.target === postcardEl || e.target === stickersLayer) clearSelection(); });

      function addSticker(id) {
        window.HAILU_AUDIO.playDropSfx();
        clearSelection();
        const el = document.createElement("div");
        el.className = "placed-sticker is-selected";
        if (id.startsWith("tag_")) { el.style.width = "108px"; el.style.height = "46px"; el.style.margin = "-23px 0 0 -54px"; }
        el._state = { x: (Math.random() - 0.5) * 40, y: (Math.random() - 0.5) * 30 - 30, scale: 1, rot: 0 };
        el.style.zIndex = String(++zCounter);
        el.innerHTML = `
          <div class="sticker-toolbar">
            <button class="sticker-tool-btn" data-act="zoom-in">＋</button>
            <button class="sticker-tool-btn" data-act="zoom-out">－</button>
            <button class="sticker-tool-btn" data-act="rotate">↻</button>
            <button class="sticker-tool-btn" data-act="top">置顶</button>
            <button class="sticker-tool-btn" data-act="del" style="color:#FFB86B">删除</button>
          </div>
          <div class="sticker-graphic" style="width:100%;height:100%;pointer-events:none">${window.HAILU_SVG.sticker(id)}</div>
        `;
        applyTransform(el);

        const pointers = new Map();
        let baseState = null, startDist = 0, startAngle = 0;
        el.querySelector(".sticker-toolbar").addEventListener("pointerdown", (e) => e.stopPropagation());
        el.querySelector(".sticker-toolbar").addEventListener("click", (e) => {
          const act = e.target.dataset.act;
          if (act === "top") el.style.zIndex = String(++zCounter);
          else if (act === "zoom-in") { el._state.scale = Math.min(2.2, el._state.scale + 0.15); applyTransform(el); }
          else if (act === "zoom-out") { el._state.scale = Math.max(0.45, el._state.scale - 0.15); applyTransform(el); }
          else if (act === "rotate") { el._state.rot += 20; applyTransform(el); }
          else if (act === "del") { el.classList.add("is-removing"); setTimeout(() => el.remove(), 250); }
        });

        el.addEventListener("pointerdown", (e) => {
          e.stopPropagation(); clearSelection(); el.classList.add("is-selected"); el.setPointerCapture(e.pointerId);
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          baseState = { ...el._state, startX: e.clientX, startY: e.clientY };
          if (pointers.size === 2) {
            const pts = [...pointers.values()];
            startDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
            startAngle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x) * (180 / Math.PI);
          }
        });
        el.addEventListener("pointermove", (e) => {
          if (!pointers.has(e.pointerId)) return;
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (pointers.size === 1) {
            el._state.x = baseState.x + (e.clientX - baseState.startX);
            el._state.y = baseState.y + (e.clientY - baseState.startY);
          } else if (pointers.size === 2) {
            const pts = [...pointers.values()];
            const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
            const angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x) * (180 / Math.PI);
            if (startDist > 0) el._state.scale = Math.min(2.4, Math.max(0.4, baseState.scale * (dist / startDist)));
            el._state.rot = baseState.rot + (angle - startAngle);
          }
          applyTransform(el);
        });
        const release = (e) => {
          pointers.delete(e.pointerId);
          if (pointers.size === 1) { const r = [...pointers.values()][0]; baseState = { ...el._state, startX: r.x, startY: r.y }; }
        };
        el.addEventListener("pointerup", release); el.addEventListener("pointercancel", release);
        stickersLayer.appendChild(el);
      }

      document.getElementById("btn-reset-card").addEventListener("click", () => {
        app.openConfirm("确定要清空当前贴纸，恢复初始明信片模板吗？", () => { stickersLayer.innerHTML = ""; app.showToast("画布已重置～"); });
      });

      document.getElementById("btn-export-card").addEventListener("click", () => {
        clearSelection();
        flashEl.classList.remove("is-flashing"); void flashEl.offsetWidth; flashEl.classList.add("is-flashing");
        setTimeout(async () => {
          const dataUrl = await renderPostcardTo1080();
          app.openModal(`
            <h3 class="modal-title">✨ 专属护眼明信片已生成</h3>
            <img src="${dataUrl}" alt="护眼出海明信片" style="width:100%;border-radius:14px;border:2px solid #142336;display:block;margin-bottom:10px" />
            <p class="modal-body-text" style="text-align:center;font-size:12px;color:#5B6E7D">微信内可长按上方图片保存相册，或点击下方按钮下载 PNG</p>
            <div class="modal-btn-row"><a class="btn-coral" href="${dataUrl}" download="hailu-eye-vacation.png" style="text-align:center;text-decoration:none;display:block;width:100%">保存高清卡片 (1080×1080)</a></div>
          `);
        }, 400);
      });

      document.getElementById("btn-share-card").addEventListener("click", () => {
        app.configureWeChatShare(window.HAILU_CONFIG.share.postcardTitle);
        app.openModal(`
          <h3 class="modal-title">🌊 分享给正在用眼的朋友</h3>
          <p class="modal-body-text" style="text-align:center"><strong>分享标题：</strong><br/>「${window.HAILU_CONFIG.share.postcardTitle}」<br/><br/>请点击微信右上角 <strong>···</strong> 发送给好友或分享到朋友圈，提醒 TA 给眼睛放个假！</p>
          <div class="modal-btn-row"><button class="btn-sea" onclick="window.HAILU_APP.closeModal()">我知道了</button></div>
        `);
      });

      // 返回首页时全量重置所有页面数据，允许重新来一次
      document.getElementById("btn-back-home").addEventListener("click", () => {
        app.openConfirm("返回首页将重置本次互动记录，重新开启护眼出海之旅，确定吗？", () => {
          app.resetAllPages();
          app.goToPage(1);
        });
      });

      function svgStringToImage(svgMarkup) {
        return new Promise((resolve) => {
          const clean = svgMarkup.includes("xmlns=") ? svgMarkup : svgMarkup.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
          const url = URL.createObjectURL(new Blob([clean], { type: "image/svg+xml;charset=utf-8" }));
          const img = new Image();
          img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
          img.onerror = () => resolve(null);
          img.src = url;
        });
      }

      async function renderPostcardTo1080() {
        const size = 1080, canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const grad = ctx.createLinearGradient(0, 0, 0, size);
        grad.addColorStop(0, "#E8F7FD"); grad.addColorStop(0.62, "#BFE8F5"); grad.addColorStop(1, "#6FB7D9");
        ctx.fillStyle = grad; ctx.fillRect(0, 0, size, size);

        const bgImg = await svgStringToImage(`<svg viewBox="0 0 360 360" width="1080" height="1080"><circle cx="300" cy="64" r="28" fill="#FFB86B" opacity="0.65"/><path d="M0 240 Q90 215 180 240 T360 236 V360 H0 Z" fill="#2CAEE6" opacity="0.6"/><path d="M0 278 Q90 256 180 280 T360 275 V360 H0 Z" fill="#0E87C4" opacity="0.55"/></svg>`);
        if (bgImg) ctx.drawImage(bgImg, 0, 0, size, size);

        const bottleImg = await svgStringToImage(window.HAILU_SVG.bottle("360", "510"));
        if (bottleImg) ctx.drawImage(bottleImg, (size - 340) / 2, 500, 340, 480);

        ctx.fillStyle = "#142336"; ctx.font = "900 40px 'PingFang SC', sans-serif"; ctx.textAlign = "center";
        ctx.fillText(cfg.fixedSlogan, size / 2, 74);

        const scaleRatio = size / postcardEl.clientWidth;
        const placed = [...stickersLayer.querySelectorAll(".placed-sticker")].sort((a, b) => Number(a.style.zIndex || 0) - Number(b.style.zIndex || 0));
        for (const el of placed) {
          const s = el._state, stImg = await svgStringToImage(el.querySelector(".sticker-graphic").innerHTML);
          if (!stImg) continue;
          const w = el.offsetWidth * scaleRatio, h = el.offsetHeight * scaleRatio;
          ctx.save(); ctx.translate(size / 2 + s.x * scaleRatio, size / 2 + s.y * scaleRatio);
          ctx.rotate((s.rot * Math.PI) / 180); ctx.scale(s.scale, s.scale);
          ctx.drawImage(stImg, -w / 2, -h / 2, w, h); ctx.restore();
        }
        ctx.save(); ctx.globalAlpha = 0.15; ctx.fillStyle = "#142336"; ctx.font = "700 28px 'PingFang SC', sans-serif"; ctx.textAlign = "right";
        ctx.fillText("海露® 0.1% · 护眼出海计划", size - 36, size - 28); ctx.restore();
        return canvas.toDataURL("image/png");
      }

      function reset() {
        stickersLayer.innerHTML = "";
        drawerEl.classList.remove("is-collapsed");
        document.getElementById("p9-drawer-toggle").textContent = "收起";
      }
      return { reset };
    };

    /* ========= 9. 主控路由与各页初始化 ========= */
    window.addEventListener("DOMContentLoaded", () => {
      const cfg = window.HAILU_CONFIG, svg = window.HAILU_SVG;
      const pages = [...document.querySelectorAll(".page")];
      const pagePill = document.getElementById("page-pill");
      const prevBtn = document.getElementById("btn-prev-page");
      const waveOverlay = document.getElementById("wave-overlay");
      const wavePath = document.getElementById("wave-path");
      const toastEl = document.getElementById("ip-toast");
      const modalBackdrop = document.getElementById("modal-backdrop");
      const modalContent = document.getElementById("modal-content");

      let currentPage = 1, isTransitioning = false, toastTimer = null;
      let unlockedPages = { 1: true, 2: false, 3: false, 4: false, 5: false, 6: true, 7: false, 8: true, 9: true };

      const trackEvent = (name, payload = {}) => window.dispatchEvent(new CustomEvent("hailu_track", { detail: { name, payload } }));
      const showToast = (msg) => {
        toastEl.textContent = msg; toastEl.classList.add("is-visible");
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("is-visible"), 2200);
      };
      const openModal = (html) => { modalContent.innerHTML = html; modalBackdrop.classList.add("is-open"); };
      const closeModal = () => modalBackdrop.classList.remove("is-open");
      const openConfirm = (text, onOk) => {
        openModal(`<h3 class="modal-title">温馨提示</h3><p class="modal-body-text" style="text-align:center">${text}</p><div class="modal-btn-row"><button class="btn-ghost" id="confirm-cancel">取消</button><button class="btn-coral" id="confirm-ok">确认</button></div>`);
        document.getElementById("confirm-cancel").onclick = closeModal;
        document.getElementById("confirm-ok").onclick = () => { closeModal(); onOk(); };
      };

      document.getElementById("modal-close").onclick = closeModal;
      modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });

      function updateHud(target) {
        pagePill.textContent = `${String(target).padStart(2, "0")} / 09`;
        prevBtn.classList.toggle("is-hidden", target <= 1);
      }

      function goToPage(target) {
        if (target < 1 || target > 9 || target === currentPage || isTransitioning) return;
        isTransitioning = true;
        waveOverlay.style.opacity = "1";
        wavePath.setAttribute("d", "M0,100 Q25,85 50,100 T100,100 L100,100 L0,100 Z");
        const swap = () => {
          pages.forEach((p) => p.classList.toggle("is-active", Number(p.dataset.page) === target));
          currentPage = target;
          updateHud(target);
          trackEvent("page_view", { page: target });
        };
        if (window.gsap) {
          window.gsap.timeline({ onComplete: () => { waveOverlay.style.opacity = "0"; isTransitioning = false; } })
            .to(wavePath, { duration: 0.3, ease: "power2.out", attr: { d: "M0,0 Q25,12 50,0 T100,0 L100,100 L0,100 Z" }, onComplete: swap })
            .to(wavePath, { duration: 0.32, ease: "power2.in", attr: { d: "M0,0 Q25,0 50,0 T100,0 L100,0 L0,0 Z" } });
        } else {
          swap(); setTimeout(() => { waveOverlay.style.opacity = "0"; isTransitioning = false; }, 320);
        }
      }

      // 返回上一页按钮
      prevBtn.addEventListener("click", () => {
        if (currentPage > 1) goToPage(currentPage - 1);
      });

      document.getElementById("audio-toggle").addEventListener("click", () => {
        showToast(window.HAILU_AUDIO.toggle() ? "🎵 轻柔海风 BGM 已开启" : "🔇 背景音乐已静音");
      });

      // 点击海露眼药水（P8 额外联动旁边眼睛眨眼发光，所有页面文字框画面居中）
      document.querySelectorAll(".bottle-anchor:not(#p5-center-bottle)").forEach((anchor) => {
        anchor.innerHTML = svg.bottle();
        anchor.addEventListener("click", (e) => {
          e.stopPropagation();
          window.HAILU_AUDIO.playDropSfx();
          const pageId = Number(anchor.dataset.bottlePage);
          if (pageId === 8) {
            const eyeBox = document.getElementById("p8-ip-cloud");
            eyeBox.classList.remove("is-glow-blink");
            void eyeBox.offsetWidth;
            eyeBox.classList.add("is-glow-blink");
            setTimeout(() => eyeBox.classList.remove("is-glow-blink"), 950);
          }
          showToast(cfg.bottleMessages[pageId] || "一滴海露，eye上海风温柔");
        });
      });
      document.getElementById("p5-center-bottle").innerHTML = svg.bottle();

      document.querySelectorAll(".swipe-hint").forEach((hint) => {
        hint.innerHTML = `<svg class="swipe-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 15l-6-6-6 6"/></svg><span>向上轻滑继续出海</span>`;
        hint.addEventListener("click", () => { if (unlockedPages[currentPage]) goToPage(currentPage + 1); });
      });

      let touchStartY = 0, touchIgnore = false;
      const wrapper = document.getElementById("pages-wrapper");
      wrapper.addEventListener("pointerdown", (e) => {
        touchStartY = e.clientY;
        touchIgnore = Boolean(e.target.closest(".peel-layer, .drag-drop-item, .p9-postcard, .p9-sticker-tray, .quiz-opt-btn"));
      });
      wrapper.addEventListener("pointerup", (e) => {
        if (touchIgnore || isTransitioning || modalBackdrop.classList.contains("is-open")) return;
        const dy = e.clientY - touchStartY;
        if (dy < -75) {
          if (currentPage === 1) return;
          if (!unlockedPages[currentPage]) {
            const msg = currentPage === 2 ? "请先完成上方 3 道用眼小测试哦～" : currentPage === 7 ? "请先点击卡片看完四步护眼指南 ✨" : "先完成本页小互动，解锁下一站蓝海 ✨";
            return showToast(msg);
          }
          if (currentPage < 9) goToPage(currentPage + 1);
        } else if (dy > 90 && currentPage > 1 && currentPage !== 9) {
          goToPage(currentPage - 1);
        }
      });

      // P1：首次点击进入顺便轻柔启动海风 BGM
      document.getElementById("p1-logo").innerHTML = svg.hailuLogo;
      document.getElementById("p1-hero-bottle").innerHTML = svg.bottle();
      document.getElementById("p1-title").innerHTML = cfg.p1.titleHtml;
      document.getElementById("p1-subtitle").textContent = cfg.p1.subtitle;
      document.getElementById("p1-cta").textContent = cfg.p1.cta;
      const bokeh = document.getElementById("p1-bokeh");
      for (let i = 0; i < 10; i++) {
        const dot = document.createElement("div"); dot.className = "p1-bokeh-dot";
        const size = 18 + Math.random() * 34;
        dot.style.width = dot.style.height = `${size}px`;
        dot.style.left = `${Math.random() * 90}%`; dot.style.top = `${15 + Math.random() * 70}%`;
        dot.style.opacity = String(0.3 + Math.random() * 0.5);
        bokeh.appendChild(dot);
      }
      const boatsLayer = document.getElementById("p1-boats");
      [18, 42, 66].forEach((topPct, i) => {
        const b = document.createElement("div"); b.className = "p1-boat";
        b.style.top = `${topPct}%`; b.style.left = `${-5 + i * 28}%`;
        b.style.animationDelay = `${-i * 5}s`;
        b.innerHTML = `<svg width="42" height="32" viewBox="0 0 42 32" fill="#FFFFFF"><path d="M22 4 L34 22 H22 Z"/><path d="M20 9 L11 22 H20 Z"/><path d="M8 24 H36 L31 30 H13 Z"/></svg>`;
        boatsLayer.appendChild(b);
      });
      document.getElementById("page-1").addEventListener("click", () => {
        window.HAILU_AUDIO.playDropSfx();
        window.HAILU_AUDIO.autoStartOnFirstGesture();
        goToPage(2);
      });

      // P4
      document.getElementById("p4-title").textContent = cfg.p4.title;
      document.getElementById("p4-hint").textContent = cfg.p4.hint;
      const listEl = document.getElementById("p4-cards-list"), unlockedSet = new Set();
      function renderP4() {
        unlockedSet.clear();
        unlockedPages[4] = false;
        document.getElementById("p4-bottle").classList.add("is-hidden");
        document.getElementById("p4-swipe-hint").classList.remove("is-visible");
        listEl.innerHTML = cfg.p4.myths.map((m, i) => `<div class="myth-card" data-myth-id="${m.id}"><div class="myth-badge">${m.emoji}</div><div class="myth-text-wrap"><div class="myth-label">常见误区 0${i + 1}</div><p class="myth-quote">“${m.cardTitle}”</p></div><div class="myth-status">点亮解锁 →</div></div>`).join("");
        listEl.querySelectorAll(".myth-card").forEach((card) => {
          card.addEventListener("click", () => {
            const myth = cfg.p4.myths.find((m) => m.id === card.dataset.mythId);
            window.HAILU_AUDIO.playDropSfx(); card.classList.add("is-unlocked");
            card.querySelector(".myth-status").textContent = "已解锁 ✓";
            unlockedSet.add(myth.id);
            openModal(`<div class="modal-preline">💡 真相解锁</div><h3 class="modal-title">${myth.popupTitle}</h3><p class="modal-body-text">${myth.popupBody}</p><div class="modal-btn-row"><button class="btn-sea" onclick="window.HAILU_APP.closeModal()">收下护眼干货</button></div>`);
            if (unlockedSet.size === cfg.p4.myths.length) {
              unlockedPages[4] = true;
              document.getElementById("p4-bottle").classList.remove("is-hidden");
              document.getElementById("p4-swipe-hint").classList.add("is-visible");
            }
          });
        });
      }
      renderP4();

      // P6（中心仅居中放大的海露眼药水）
      document.getElementById("p6-title").textContent = cfg.p6.title;
      document.getElementById("p6-sub").textContent = cfg.p6.sub;
      document.getElementById("p6-waves-bg").innerHTML = `<svg viewBox="0 0 360 640" width="100%" height="100%" preserveAspectRatio="none"><path d="M0 340 Q90 320 180 340 T360 340 V640 H0 Z" fill="#6FB7D9" opacity="0.26"/><path d="M0 440 Q90 420 180 440 T360 440 V640 H0 Z" fill="#2CAEE6" opacity="0.22"/></svg>`;
      const ring = document.getElementById("p6-personas-ring"), bubble = document.getElementById("p6-bubble-card");
      ring.innerHTML = cfg.p6.personas.map((p) => `<button class="persona-btn" data-pid="${p.id}"><span class="persona-emoji">${p.emoji}</span><span class="persona-name">${p.name}</span></button>`).join("");
      const selectPersona = (p, btn) => {
        ring.querySelectorAll(".persona-btn").forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        bubble.innerHTML = `<div class="p6-bubble-title">${p.emoji} ${p.name}</div><p class="p6-bubble-text">${p.detail}</p>`;
      };
      ring.querySelectorAll(".persona-btn").forEach((btn, idx) => btn.addEventListener("click", () => { window.HAILU_AUDIO.playDropSfx(); selectPersona(cfg.p6.personas[idx], btn); }));
      selectPersona(cfg.p6.personas[0], ring.querySelector(".persona-btn"));

      // P8
      document.getElementById("p8-slogan-box").innerHTML = cfg.p8.slogansHtml.map((s) => `<p class="p8-slogan-line">${s}</p>`).join("");
      document.getElementById("p8-eye-svg").innerHTML = svg.eyeIP("normal");
      document.getElementById("p8-brand-value").innerHTML = cfg.p8.valueLines.join("<br/>");
      document.getElementById("p8-logos-row").innerHTML = `${svg.hailuLogo}${svg.ruilinLogo}`;
      const diyBtn = document.getElementById("p8-go-diy");
      diyBtn.textContent = cfg.p8.cta;
      diyBtn.addEventListener("click", () => goToPage(9));
      const particles = document.getElementById("p8-particles");
      for (let i = 0; i < 14; i++) {
        const p = document.createElement("div"); p.className = "p8-particle";
        p.style.left = `${8 + Math.random() * 84}%`; p.style.bottom = `${8 + Math.random() * 45}%`;
        p.style.animationDelay = `${Math.random() * 3}s`; particles.appendChild(p);
      }

      function configureWeChatShare(customTitle) {
        if (window.wx && typeof window.wx.ready === "function") {
          window.wx.ready(() => {
            const data = { title: customTitle || cfg.share.title, desc: cfg.share.desc, link: cfg.share.link, imgUrl: cfg.share.imgUrl };
            if (window.wx.updateAppMessageShareData) window.wx.updateAppMessageShareData(data);
            if (window.wx.updateTimelineShareData) window.wx.updateTimelineShareData(data);
          });
        }
      }

      const appApi = {
        goToPage, showToast, openModal, closeModal, openConfirm, trackEvent, configureWeChatShare,
        getCurrentPage: () => currentPage,
        setPageUnlocked: (p, st) => { unlockedPages[p] = st; },
        resetAllPages: () => {}
      };
      window.HAILU_APP = appApi;

      const p2Ctrl = window.HAILU_P2(appApi);
      const p3Ctrl = window.HAILU_P3(appApi);
      const p5Ctrl = window.HAILU_P5(appApi);
      const p7Ctrl = window.HAILU_P7(appApi);
      const p9Ctrl = window.HAILU_P9(appApi);

      appApi.resetAllPages = () => {
        unlockedPages = { 1: true, 2: false, 3: false, 4: false, 5: false, 6: true, 7: false, 8: true, 9: true };
        p2Ctrl.reset();
        p3Ctrl.reset();
        renderP4();
        p5Ctrl.reset();
        selectPersona(cfg.p6.personas[0], ring.querySelector(".persona-btn"));
        p7Ctrl.reset();
        p9Ctrl.reset();
      };
    });
  </script>
</body>
</html>
