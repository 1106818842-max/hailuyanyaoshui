<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>一滴海露，eye上海风温柔｜给眼睛放个假</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js" defer></script>
  <style>
    :root {
      --sea-dark:   #4A5A6A;
      --sea-mid:    #6FB7D9;
      --sea-light:  #BFE8F5;
      --sea-bright: #E8F7FD;
      --water:      #2CAEE6;
      --water-deep: #0E87C4;
      --brand-blue: #0062C4;
      --ink:        #142336;
      --ink-soft:   #5B6E7D;
      --coral:      #FFB86B;
      --coral-deep: #F0922E;
      --white:      #FFFFFF;

      --font-title: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      --font-body:  "PingFang SC", "Noto Sans SC", system-ui, -apple-system, sans-serif;

      --ease-soft:   cubic-bezier(0.33, 1, 0.68, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

      --z-page: 1;
      --z-active: 5;
      --z-hud: 30;
      --z-toast: 70;
      --z-wave: 80;
      --z-modal: 90;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1B2834;
      font-family: var(--font-body);
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
    }

    .app-stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--sea-bright);
      overscroll-behavior: none;
    }

    @media (min-width: 520px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #27445C, #121E29);
      }
      .app-stage {
        width: min(440px, calc(100dvh * 9 / 19.5));
        height: min(956px, 96dvh);
        border-radius: 34px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45), 0 0 0 6px rgba(255, 255, 255, 0.12);
      }
    }

    /* 顶部全局 HUD：返回上一页 + 页码 + 轻柔BGM开关 */
    .global-hud {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: var(--z-hud);
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .global-hud > * { pointer-events: auto; }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-prev-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 5px 10px;
      border: 1.5px solid rgba(14, 135, 196, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: transform 180ms, opacity 220ms;
    }
    .back-prev-btn:active { transform: scale(0.93); }
    .back-prev-btn.is-hidden { opacity: 0; pointer-events: none; visibility: hidden; }

    .page-pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--brand-blue);
      letter-spacing: 0.8px;
      box-shadow: 0 4px 12px rgba(14, 135, 196, 0.12);
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border: 1.5px solid rgba(44, 174, 230, 0.35);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: transform 200ms var(--ease-soft), background 200ms;
    }
    .audio-btn.is-playing {
      background: var(--water);
      color: var(--white);
      border-color: var(--water);
    }
    .audio-btn:active { transform: scale(0.94); }

    .pages-wrapper { position: relative; width: 100%; height: 100%; }

    .page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: var(--z-page);
      transition: opacity 420ms var(--ease-soft), visibility 420ms;
    }
    .page.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: var(--z-active);
    }

    .page-inner {
      position: relative;
      width: 100%;
      height: 100%;
      padding: calc(max(14px, env(safe-area-inset-top)) + 42px) 18px calc(max(16px, env(safe-area-inset-bottom)) + 14px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .section-title {
      margin: 0 0 6px;
      font-family: var(--font-title);
      font-size: clamp(17px, 4.5vw, 20.5px);
      line-height: 1.35;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
      text-wrap: balance;
    }
    .section-title.light-ink { color: #F2F7FA; }

    .section-sub {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ink-soft);
      text-align: center;
      text-wrap: balance;
    }

    .tag-chip {
      display: inline-block;
      margin: 0 auto 6px;
      padding: 3px 12px;
      border-radius: 999px;
      background: rgba(44, 174, 230, 0.14);
      color: var(--water-deep);
      font-size: 11px;
      font-weight: 700;
    }

    .btn-coral, .btn-sea, .btn-ghost, .btn-text {
      border: none;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 220ms var(--ease-bounce), box-shadow 220ms;
    }
    .btn-coral {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--coral), var(--coral-deep));
      color: var(--white);
      font-size: 13.5px;
      box-shadow: 0 8px 20px rgba(240, 146, 46, 0.34);
    }
    .btn-sea {
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--water), var(--water-deep));
      color: var(--white);
      font-size: 13.5px;
      box-shadow: 0 8px 20px rgba(14, 135, 196, 0.28);
    }
    .btn-ghost {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(20, 35, 54, 0.18);
      color: var(--ink);
      font-size: 12.5px;
    }
    .btn-text {
      padding: 8px 12px;
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      text-decoration: underline;
    }
    .btn-coral:active, .btn-sea:active, .btn-ghost:active { transform: scale(0.95); }

    .floating-soft { animation: floatSoft 3.6s ease-in-out infinite; }
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .pulse-cta { animation: pulseCta 1.2s ease-in-out infinite; }
    @keyframes pulseCta {
      0%, 100% { transform: scale(1); box-shadow: 0 6px 18px rgba(44, 174, 230, 0.25); }
      50% { transform: scale(1.04); box-shadow: 0 10px 26px rgba(44, 174, 230, 0.42); }
    }

    .swipe-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--water-deep);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 400ms var(--ease-soft), transform 400ms var(--ease-soft);
    }
    .swipe-hint.is-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      cursor: pointer;
    }
    .swipe-arrow {
      width: 22px;
      height: 22px;
      animation: swipeUpBounce 1.4s ease-in-out infinite;
    }
    @keyframes swipeUpBounce {
      0%, 100% { transform: translateY(2px); opacity: 0.75; }
      50% { transform: translateY(-5px); opacity: 1; }
    }

    .bottle-anchor {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 250ms var(--ease-bounce);
    }
    .bottle-anchor:active { transform: scale(0.92) rotate(-4deg); }
    .bottle-anchor::after {
      content: "点我一下";
      position: absolute;
      bottom: -14px;
      font-size: 10px;
      font-weight: 700;
      color: var(--water-deep);
      background: rgba(255, 255, 255, 0.92);
      padding: 1px 7px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* ============ P1 启动页 ============ */
    .page-p1 {
      background: radial-gradient(circle at 50% 42%, #F6FCFF 0%, #BFE8F5 48%, #6FB7D9 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 66px 18px 40px;
      cursor: pointer;
    }
    .p1-bokeh-layer, .p1-boats-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .p1-bokeh-dot {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0));
    }
    .p1-boat { position: absolute; opacity: 0.5; animation: boatDrift 20s linear infinite; }
    @keyframes boatDrift { from { transform: translateX(-20px); } to { transform: translateX(180px); } }

    .p1-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 6px;
    }
    .brand-badge {
      margin-bottom: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 6px 18px rgba(0, 98, 196, 0.12);
    }
    .p1-hero-bottle { width: 165px; height: 225px; margin: 4px 0 10px; }
    .p1-title {
      margin: 0 0 10px;
      font-size: clamp(19px, 5.2vw, 24px);
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
      letter-spacing: 0.2px;
    }
    .p1-title .hl-eye { color: var(--brand-blue); font-style: italic; }
    .p1-subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.65);
      padding: 6px 16px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .p1-cta-wrap { position: relative; z-index: 2; display: flex; justify-content: center; }
    .p1-cta-pill {
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--brand-blue);
      font-size: 13.5px;
      font-weight: 800;
      border: 2px solid rgba(44, 174, 230, 0.35);
      white-space: nowrap;
    }

    /* ============ P2 自测页 ============ */
    .page-p2 { background: linear-gradient(180deg, #E8F7FD 0%, #CBEAF6 100%); }
    .p2-ip-stage { display: flex; justify-content: center; align-items: center; height: 108px; }
    .p2-quiz-card {
      position: relative;
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid var(--ink);
      border-radius: 22px;
      padding: 15px;
      box-shadow: 0 12px 28px rgba(14, 135, 196, 0.14);
      flex: 1;
      max-height: 365px;
      display: flex;
      flex-direction: column;
    }
    .quiz-progress { display: flex; gap: 6px; margin-bottom: 10px; }
    .quiz-step-dot { flex: 1; height: 6px; border-radius: 999px; background: #DCECF2; transition: background 300ms; }
    .quiz-step-dot.is-done { background: var(--water); }
    .quiz-step-dot.is-current { background: var(--coral); }
    .quiz-q-title { margin: 0 0 10px; font-size: 15px; font-weight: 800; color: var(--ink); line-height: 1.4; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-opt-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 13px;
      border: 1.5px solid #CFE3EC;
      background: #F7FCFE;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 240ms var(--ease-bounce), border-color 240ms, background 240ms;
    }
    .quiz-opt-btn.is-selected {
      transform: scale(1.02);
      border-color: var(--water);
      background: #E0F5FC;
      color: var(--water-deep);
    }
    .quiz-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(44, 174, 230, 0.32);
      transform: scale(0);
      animation: rippleSpread 520ms var(--ease-soft) forwards;
      pointer-events: none;
    }
    @keyframes rippleSpread { to { transform: scale(4); opacity: 0; } }
    .p2-bottle { align-self: flex-end; width: 64px; height: 90px; margin-top: 6px; }

    /* ============ P3 场景共鸣（缩小上方屏幕画面 + 放大下方文字区 + 太阳云朵下移 + 下滑UI） ============ */
    .page-p3 { background: var(--sea-dark); }
    .p3-dark-stage {
      position: absolute;
      inset: 0;
      padding: calc(max(14px, env(safe-area-inset-top)) + 44px) 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(180deg, #3D4C5A 0%, #4A5A6A 100%);
      transition: opacity 700ms var(--ease-soft);
    }

    /* 缩小的屏幕操作区 */
    .p3-screen-arena {
      position: relative;
      width: 86%;
      height: 210px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .p3-comic-strip {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .p3-comic-panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 12px 4px;
      text-align: center;
      color: #DCE5EE;
      font-size: 11px;
      font-weight: 600;
    }
    .p3-peel-stack {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
    }
    .peel-layer {
      position: absolute;
      inset: 4px;
      border-radius: 18px;
      border: 2.5px solid var(--ink);
      background: #2C3844;
      color: #E5EEF5;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      transform-origin: center bottom;
    }
    .peel-layer::before, .peel-layer::after {
      content: "";
      position: absolute;
      width: 44px;
      height: 15px;
      background: rgba(255, 224, 150, 0.78);
      border: 1px dashed rgba(20, 35, 54, 0.3);
    }
    .peel-layer::before { top: -7px; left: 16px; transform: rotate(-14deg); }
    .peel-layer::after { top: -7px; right: 16px; transform: rotate(14deg); }
    .peel-layer.is-jitter { animation: peelJitter 150ms linear; }
    @keyframes peelJitter {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      25% { transform: translate(-4px, -2px) rotate(-1.5deg); }
      75% { transform: translate(4px, -3px) rotate(1.5deg); }
    }
    .peel-gesture-pill {
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 184, 107, 0.22);
      border: 1px solid var(--coral);
      color: var(--coral);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 占比更大的下方文字板块 */
    .p3-text-panel {
      flex: 1;
      min-height: 210px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }
    .p3-poem {
      text-align: center;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.95;
      letter-spacing: 0.5px;
    }
    .p3-science-note {
      margin: 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.26);
      color: #DCE7F0;
      font-size: 12.5px;
      line-height: 1.68;
      text-align: center;
    }

    /* 撕开屏幕后的层层海浪交叠海景（太阳与云朵下移避让上方文字） */
    .p3-sea-reveal {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #F4FBFF 0%, #D3F2FC 45%, #8AD2EC 100%);
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 900ms var(--ease-soft);
    }
    .p3-sea-reveal.is-revealed { opacity: 1; pointer-events: auto; }
    .p3-waves-scene { position: absolute; inset: 0; pointer-events: none; }
    .p3-wave-layer { position: absolute; left: -12%; width: 124%; bottom: 0; }
    .p3-wave-1 { animation: waveSwayA 6.5s ease-in-out infinite; }
    .p3-wave-2 { animation: waveSwayB 5.2s ease-in-out infinite; }
    .p3-wave-3 { animation: waveSwayA 4.4s ease-in-out infinite reverse; }
    .p3-wave-4 { animation: waveSwayB 3.8s ease-in-out infinite; }
    @keyframes waveSwayA {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(4%) translateY(-6px); }
    }
    @keyframes waveSwayB {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(-4%) translateY(5px); }
    }
    .p3-reveal-copy-wrap {
      position: relative;
      z-index: 4;
      margin-top: calc(max(14px, env(safe-area-inset-top)) + 56px);
      padding: 0 20px;
      text-align: center;
    }
    .p3-reveal-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--brand-blue);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(14, 135, 196, 0.12);
    }
    .p3-reveal-tip {
      margin: 0;
      font-size: clamp(17px, 4.6vw, 20px);
      font-weight: 900;
      color: var(--ink);
      line-height: 1.5;
    }

    /* 出现大海后的底部下滑继续探索 UI */
    .p3-sea-down-ui {
      position: absolute;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      z-index: 16;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid var(--ink);
      color: var(--brand-blue);
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(14, 135, 196, 0.28);
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 420ms var(--ease-soft), transform 420ms var(--ease-soft);
    }
    .p3-sea-down-ui.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .p3-down-arrow {
      display: inline-block;
      animation: downBob 1.3s ease-in-out infinite;
    }
    @keyframes downBob {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(3px); }
    }

    /* ============ P4 误区科普页 ============ */
    .page-p4 { background: linear-gradient(180deg, var(--sea-light) 0%, #D9F2FA 100%); }
    .p4-cards-list { display: flex; flex-direction: column; gap: 12px; margin: 8px 0; }
    .myth-card {
      position: relative;
      overflow: hidden;
      background: var(--white);
      border: 2px solid var(--ink);
      border-radius: 18px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      filter: grayscale(1) contrast(0.92);
      opacity: 0.88;
      transition: filter 600ms var(--ease-soft), transform 600ms var(--ease-bounce), opacity 600ms, box-shadow 600ms;
    }
    .myth-card:nth-child(1) { transform: rotate(-1.5deg); }
    .myth-card:nth-child(2) { transform: rotate(1.4deg); }
    .myth-card:nth-child(3) { transform: rotate(-1deg); }
    .myth-card.is-unlocked {
      filter: grayscale(0) saturate(1.15);
      opacity: 1;
      transform: rotate(0deg);
      box-shadow: 0 10px 24px rgba(44, 174, 230, 0.22);
      background: linear-gradient(135deg, #FFFFFF 0%, #E8F8FE 100%);
    }
    .myth-card.is-unlocked::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.7) 50%, transparent 70%);
      animation: shimmerSweep 700ms var(--ease-soft) forwards;
      pointer-events: none;
    }
    @keyframes shimmerSweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .myth-badge {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #E2EEF3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .myth-card.is-unlocked .myth-badge { background: rgba(255, 184, 107, 0.28); }
    .myth-text-wrap { flex: 1; min-width: 0; }
    .myth-label { font-size: 11px; font-weight: 800; color: var(--coral-deep); }
    .myth-quote { margin: 2px 0 0; font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.35; }
    .myth-status { font-size: 11px; font-weight: 700; color: var(--water-deep); white-space: nowrap; }
    .p4-sea-footer { display: flex; justify-content: center; min-height: 76px; }
    .p4-bottle { width: 62px; height: 84px; transition: opacity 500ms, transform 500ms var(--ease-bounce); }
    .p4-bottle.is-hidden { opacity: 0; transform: translateY(20px) scale(0.8); pointer-events: none; }

    /* ============ P5 拖拽水滴页 ============ */
    .page-p5 {
      background: linear-gradient(180deg, #FFE8CE 0%, #BFE8F5 46%, #88CBE6 100%);
      transition: background 1s var(--ease-soft);
    }
    .page-p5.is-morning {
      background: linear-gradient(180deg, #FFFDF5 0%, #E8F7FD 42%, #9CD9EF 100%);
    }
    .p5-dock-stage {
      position: relative;
      height: 195px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 4px 0;
    }
    .p5-dock-wood {
      position: absolute;
      bottom: 0;
      width: 78%;
      height: 34px;
      border-radius: 12px;
      background: repeating-linear-gradient(90deg, #C79A6B 0 28px, #B48454 28px 31px);
      border: 2px solid var(--ink);
      box-shadow: 0 8px 0 rgba(20, 35, 54, 0.2);
    }
    .p5-drops-zone { position: absolute; inset: 0; pointer-events: none; transition: opacity 400ms; }
    .p5-bottle-reveal-wrap {
      position: relative;
      z-index: 8;
      margin-bottom: 18px;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .p5-bottle-reveal-wrap.is-shown {
      display: flex;
      animation: bottlePopCenter 650ms var(--ease-bounce) forwards;
    }
    @keyframes bottlePopCenter {
      0% { opacity: 0; transform: translateY(24px) scale(0.45); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .p5-center-bottle { width: 96px; height: 134px; }

    .drag-drop-item {
      position: absolute;
      width: 66px;
      height: 78px;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 250ms var(--ease-bounce);
    }
    .drag-drop-item.is-dragging { cursor: grabbing; z-index: 30; transform: scale(1.14); }
    .drag-drop-item.is-used { opacity: 0; pointer-events: none; transform: scale(0.3); }
    .drop-tag {
      margin-top: -6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      font-size: 10px;
      font-weight: 800;
      color: var(--water-deep);
      border: 1px solid var(--water);
      white-space: nowrap;
    }
    .p5-slots-grid { display: flex; flex-direction: column; gap: 8px; }
    .p5-slot {
      position: relative;
      min-height: 74px;
      border-radius: 16px;
      border: 2px dashed var(--water-deep);
      background: rgba(255, 255, 255, 0.65);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 300ms, background 300ms, box-shadow 300ms;
      animation: slotBreath 2.2s ease-in-out infinite;
    }
    @keyframes slotBreath {
      0%, 100% { box-shadow: 0 0 0 0 rgba(44, 174, 230, 0.12); }
      50% { box-shadow: 0 0 0 5px rgba(44, 174, 230, 0.22); }
    }
    .p5-slot.is-hover { background: rgba(255, 232, 198, 0.85); border-color: var(--coral-deep); }
    .p5-slot.is-filled {
      animation: none;
      border-style: solid;
      border-color: var(--coral-deep);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 20px rgba(240, 146, 46, 0.18);
      cursor: pointer;
    }
    .slot-empty-hint { font-size: 12.5px; font-weight: 700; color: var(--water-deep); white-space: nowrap; }
    .slot-card-content { width: 100%; text-align: left; animation: slideUpIn 420ms var(--ease-soft); }
    @keyframes slideUpIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .slot-card-title { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--water-deep); margin-bottom: 3px; }
    .slot-card-desc { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--ink); }

    /* ============ P6 人群适配（中心移除眼睛，海露眼药水居中放大） ============ */
    .page-p6 { background: linear-gradient(180deg, var(--sea-bright) 0%, #BFE8F5 100%); }
    .p6-waves-bg { position: absolute; inset: 0; opacity: 0.45; pointer-events: none; }
    .p6-ocean-map { position: relative; height: 276px; display: flex; align-items: center; justify-content: center; }
    .p6-center-ship { position: relative; display: flex; align-items: center; justify-content: center; }
    .p6-bottle { width: 106px; height: 150px; }
    .persona-btn {
      position: absolute;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: rgba(255, 255, 255, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(14, 135, 196, 0.18);
      transition: transform 280ms var(--ease-bounce), border-color 280ms, background 280ms;
    }
    .persona-btn:nth-child(1) { top: 6px; left: 10px; }
    .persona-btn:nth-child(2) { top: 6px; right: 10px; }
    .persona-btn:nth-child(3) { bottom: 6px; left: 10px; }
    .persona-btn:nth-child(4) { bottom: 6px; right: 10px; }
    .persona-btn.is-active {
      transform: scale(1.1);
      border-color: var(--coral-deep);
      background: #FFF9EF;
      box-shadow: 0 0 0 6px rgba(255, 184, 107, 0.35);
    }
    .persona-emoji { font-size: 21px; line-height: 1.1; }
    .persona-name { font-size: 10px; font-weight: 800; color: var(--ink); margin-top: 2px; white-space: nowrap; }
    .p6-bubble-card {
      min-height: 80px;
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid var(--ink);
      border-radius: 18px;
      padding: 12px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .p6-bubble-title { font-size: 14px; font-weight: 800; color: var(--water-deep); margin-bottom: 4px; }
    .p6-bubble-text { font-size: 12.5px; line-height: 1.5; color: var(--ink); margin: 0; }

    /* ============ P7 实用教程（卡片切换模式，无下方眼睛与眼药水） ============ */
    .page-p7 { background: linear-gradient(180deg, var(--sea-bright) 0%, #D3F0FA 100%); }
    .p7-progress-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 8px 0 4px;
    }
    .p7-dot {
      width: 28px;
      height: 7px;
      border-radius: 999px;
      background: rgba(14, 135, 196, 0.2);
      transition: background 300ms, width 300ms;
    }
    .p7-dot.is-done { background: var(--water); }
    .p7-dot.is-current { width: 40px; background: var(--coral-deep); }

    .p7-card-stage {
      position: relative;
      flex: 1;
      max-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 6px 0;
    }
    .p7-active-card {
      width: 100%;
      background: var(--white);
      border: 2.5px solid var(--ink);
      border-radius: 24px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 16px 34px rgba(14, 135, 196, 0.18), 0 8px 0 rgba(44, 174, 230, 0.22);
      cursor: pointer;
      animation: cardSwitchIn 380ms var(--ease-bounce);
    }
    @keyframes cardSwitchIn {
      from { opacity: 0; transform: translateX(36px) scale(0.94); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    .p7-card-badge {
      padding: 4px 14px;
      border-radius: 999px;
      background: #E2F4FB;
      color: var(--water-deep);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .p7-card-svg { width: 170px; height: 136px; margin: 6px 0 10px; }
    .p7-card-title { margin: 0 0 8px; font-size: 18px; font-weight: 900; color: var(--ink); }
    .p7-card-tip { margin: 0 0 14px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
    .p7-card-cta {
      padding: 10px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--water), var(--water-deep));
      color: var(--white);
      font-size: 13px;
      font-weight: 800;
    }
    .step-drop-anim { animation: dropFallAnim 1.4s ease-in infinite; }
    @keyframes dropFallAnim {
      0% { transform: translateY(-6px); opacity: 0; }
      30% { opacity: 1; }
      85% { transform: translateY(16px); opacity: 1; }
      100% { transform: translateY(20px); opacity: 0; }
    }

    /* ============ P8 收尾页（新文案 + 眼药水联动眨眼发光） ============ */
    .page-p8 { background: linear-gradient(180deg, #E8F7FD 0%, #BFE8F5 60%, #7BC4E2 100%); }
    .p8-sunbeams, .p8-particles { position: absolute; inset: 0; pointer-events: none; }
    .p8-sunbeams {
      background: conic-gradient(from 155deg at 50% -10%, rgba(255,255,255,0.45) 0deg, transparent 22deg, rgba(255,255,255,0.3) 40deg, transparent 65deg);
    }
    .p8-particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      animation: riseParticle 3.2s linear infinite;
    }
    @keyframes riseParticle {
      from { transform: translateY(20px) scale(0.7); opacity: 0; }
      30% { opacity: 0.9; }
      to { transform: translateY(-130px) scale(1.2); opacity: 0; }
    }
    .p8-inner { align-items: center; text-align: center; }
    .p8-slogan-box { margin-top: 6px; }
    .p8-slogan-line {
      margin: 4px 0;
      font-size: clamp(18px, 5vw, 22px);
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
    }
    .p8-slogan-line .hl-eye { color: var(--brand-blue); font-style: italic; }
    .p8-hero-scene { position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0; }
    .p8-ip-cloud {
      position: relative;
      width: 132px;
      height: 84px;
      transition: filter 320ms var(--ease-soft), transform 200ms ease;
    }
    .p8-ip-cloud.is-glow-blink {
      filter: drop-shadow(0 0 18px rgba(44, 174, 230, 0.95)) drop-shadow(0 0 28px rgba(255, 220, 130, 0.9));
      animation: eyeGlowBlink 900ms ease-in-out;
    }
    @keyframes eyeGlowBlink {
      0%   { transform: scaleY(1) scale(1); }
      20%  { transform: scaleY(0.12) scale(1.06); }
      45%  { transform: scaleY(1.06) scale(1.08); }
      68%  { transform: scaleY(0.15) scale(1.06); }
      100% { transform: scaleY(1) scale(1); }
    }
    .p8-eye-sparkle {
      position: absolute;
      top: -12px;
      right: -8px;
      font-size: 22px;
      opacity: 0;
      pointer-events: none;
    }
    .p8-ip-cloud.is-glow-blink .p8-eye-sparkle {
      animation: sparklePop 900ms ease-out;
    }
    @keyframes sparklePop {
      0% { opacity: 0; transform: scale(0.4) translateY(8px); }
      40% { opacity: 1; transform: scale(1.25) translateY(-4px); }
      100% { opacity: 0; transform: scale(1) translateY(-12px); }
    }
    .p8-bottle { width: 92px; height: 128px; }
    .p8-brand-value {
      background: rgba(255, 255, 255, 0.78);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--ink);
    }
    .p8-logos-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .p8-go-diy { width: 84%; font-size: 14.5px; }

    /* ============ P9 DIY 明信片 ============ */
    .page-p9 { background: linear-gradient(180deg, #E8F7FD 0%, #CBEAF6 100%); }
    .p9-inner { padding-top: calc(max(12px, env(safe-area-inset-top)) + 40px); gap: 8px; }
    .p9-title { font-size: 18px; margin-bottom: 2px; }
    .p9-tip { margin: 0; font-size: 11px; color: var(--ink-soft); text-align: center; white-space: nowrap; }
    .p9-canvas-shell { position: relative; width: min(100%, 296px); aspect-ratio: 1 / 1; margin: 0 auto; }
    .p9-postcard {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 3px solid var(--ink);
      overflow: hidden;
      background: linear-gradient(180deg, #E8F7FD 0%, #BFE8F5 62%, #6FB7D9 100%);
      box-shadow: 0 14px 30px rgba(14, 135, 196, 0.22);
      touch-action: none;
    }
    .postcard-bg-art { position: absolute; inset: 0; pointer-events: none; }
    .postcard-fixed-slogan {
      position: absolute;
      top: 12px;
      left: 8px;
      right: 8px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
      pointer-events: none;
    }
    .postcard-watermark {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 10px;
      font-weight: 700;
      color: rgba(20, 35, 54, 0.22);
      pointer-events: none;
    }
    .postcard-stickers-layer { position: absolute; inset: 0; }
    .placed-sticker {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 78px;
      height: 78px;
      margin: -39px 0 0 -39px;
      touch-action: none;
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stickerPop 380ms var(--ease-bounce);
    }
    @keyframes stickerPop { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; } }
    .placed-sticker.is-selected { outline: 2px dashed var(--coral-deep); outline-offset: 4px; border-radius: 10px; }
    .placed-sticker.is-removing { transition: transform 240ms var(--ease-soft), opacity 240ms; opacity: 0 !important; transform: scale(0.2) !important; }
    .sticker-toolbar {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 4px;
      background: var(--ink);
      padding: 2px 6px;
      border-radius: 999px;
      z-index: 5;
    }
    .placed-sticker.is-selected .sticker-toolbar { display: flex; }
    .sticker-tool-btn {
      border: none;
      background: transparent;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 4px;
      white-space: nowrap;
    }
    .p9-flash-ripple {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(44,174,230,0.4));
      opacity: 0;
      pointer-events: none;
    }
    .p9-flash-ripple.is-flashing { animation: flashCard 420ms var(--ease-soft); }
    @keyframes flashCard {
      0% { opacity: 0; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.03); }
      100% { opacity: 0; transform: scale(1.1); }
    }
    .p9-drawer { background: rgba(255, 255, 255, 0.92); border: 2px solid var(--ink); border-radius: 16px; padding: 8px 10px; }
    .p9-drawer-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: var(--ink-soft); }
    .drawer-toggle-btn {
      border: none;
      background: #E2F4FB;
      color: var(--water-deep);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .p9-sticker-tray { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px 2px; }
    .p9-drawer.is-collapsed .p9-sticker-tray { display: none; }
    .tray-sticker-btn {
      flex: 0 0 auto;
      width: 64px;
      height: 60px;
      border-radius: 12px;
      border: 1.5px solid #D5E8F0;
      background: #F8FDFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }
    .tray-sticker-btn:active { transform: scale(0.92); }
    .p9-actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px; }
    .p9-actions button { padding: 10px 10px; font-size: 12.5px; }

    /* 转场 / 画面正中央海露眼药水文字框 / 弹窗 */
    .wave-transition-overlay { position: absolute; inset: 0; z-index: var(--z-wave); pointer-events: none; opacity: 0; }
    .wave-transition-overlay svg { width: 100%; height: 100%; fill: var(--water); }

    .ip-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.86);
      z-index: var(--z-toast);
      width: max-content;
      max-width: 82%;
      padding: 14px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.97);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms var(--ease-soft), transform 280ms var(--ease-bounce);
      box-shadow: 0 18px 42px rgba(20, 35, 54, 0.28);
    }
    .ip-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: var(--z-modal);
      background: rgba(20, 35, 54, 0.56);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 280ms var(--ease-soft), visibility 280ms;
    }
    .modal-backdrop.is-open { opacity: 1; visibility: visible; }
    .modal-card {
      position: relative;
      width: 100%;
      max-width: 370px;
      max-height: 82dvh;
      overflow-y: auto;
      background: var(--white);
      border: 2.5px solid var(--ink);
      border-radius: 24px;
      padding: 22px 18px 18px;
      transform: scale(0.92);
      transition: transform 320ms var(--ease-soft);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.3);
    }
    .modal-backdrop.is-open .modal-card { transform: scale(1); }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #EDF5F8;
      color: var(--ink);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .modal-preline { font-size: 13px; font-weight: 700; color: var(--water-deep); text-align: center; margin-bottom: 6px; }
    .modal-title { margin: 0 0 10px; font-size: 17px; font-weight: 900; color: var(--ink); text-align: center; }
    .level-coral { display: inline-block; color: var(--coral-deep); animation: bounceIn 450ms var(--ease-bounce); }
    @keyframes bounceIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-body-text { font-size: 13px; line-height: 1.65; color: var(--ink); margin: 0 0 12px; }
    .modal-science-box { padding: 10px 12px; border-radius: 14px; background: #EEF8FC; font-size: 12px; line-height: 1.55; color: var(--ink-soft); margin-bottom: 14px; }
    .modal-btn-row { display: flex; gap: 10px; justify-content: center; }
    .modal-btn-row button { flex: 1; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 150ms !important; }
    }
  </style>
</head>
<body>
  <div id="app-stage" class="app-stage">
    <header class="global-hud" id="global-hud">
      <div class="hud-left">
        <button class="back-prev-btn is-hidden" id="btn-prev-page" aria-label="返回上一页">← 上一页</button>
        <div class="page-pill" id="page-pill">01 / 09</div>
      </div>
      <button class="audio-btn" id="audio-toggle" aria-label="轻柔和缓背景音乐开关">
        <span class="audio-icon" id="audio-icon">🔇</span>
        <span class="audio-label" id="audio-label">海风BGM</span>
      </button>

    /* ========= 3. 轻柔和缓 BGM（柔和五声部电钢琴和弦 + 轻柔海浪呼吸） ========= */
    window.HAILU_AUDIO = (function () {
      let ctx = null, masterGain = null, waveNode = null, lfoNode = null, chordTimer = null;
      let isPlaying = false, userMuted = false, chordIdx = 0;

      // 治愈系慢速和弦进行（Cmaj9 -> Fmaj7 -> Am9 -> G6）
      const chords = [
        [261.63, 329.63, 392.00, 493.88, 587.33],
        [174.61, 261.63, 329.63, 440.00, 523.25],
        [220.00, 329.63, 392.00, 493.88, 587.33],
        [196.00, 293.66, 329.63, 440.00, 493.88]
      ];

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
        }
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        return ctx;
      }

      function playWarmPadChord(freqs) {
        if (!ctx || !masterGain || !isPlaying) return;
        const now = ctx.currentTime;
        freqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();
          osc.type = idx === 0 ? "sine" : "triangle";
          osc.frequency.setValueAtTime(freq, now);

          filter.type = "lowpass";
          filter.frequency.setValueAtTime(880, now);

          // 柔和渐入渐出，营造轻盈海风感
          const startDelay = idx * 0.14;
          gain.gain.setValueAtTime(0.0001, now + startDelay);
          gain.gain.linearRampToValueAtTime(idx === 0 ? 0.045 : 0.022, now + startDelay + 1.1);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 4.4);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(masterGain);

          osc.start(now + startDelay);
          osc.stop(now + 4.5);
        });
      }

      function startBgm() {
        const c = ensureCtx();
        if (!c || isPlaying) return;

        masterGain = c.createGain();
        masterGain.gain.setValueAtTime(0.001, c.currentTime);
        masterGain.gain.linearRampToValueAtTime(0.85, c.currentTime + 1.2);
        masterGain.connect(c.destination);

        // 底层轻柔潮汐海浪
        const buffer = c.createBuffer(1, c.sampleRate * 4, c.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < data.length; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + 0.015 * white) / 1.015;
          lastOut = data[i];
        }
        waveNode = c.createBufferSource();
        waveNode.buffer = buffer;
        waveNode.loop = true;

        const waveFilter = c.createBiquadFilter();
        waveFilter.type = "lowpass";
        waveFilter.frequency.value = 260;

        lfoNode = c.createOscillator();
        const lfoGain = c.createGain();
        lfoNode.frequency.value = 0.12;
        lfoGain.gain.value = 120;
        lfoNode.connect(lfoGain);
        lfoGain.connect(waveFilter.frequency);

        const waveGain = c.createGain();
        waveGain.gain.value = 0.04;
        waveNode.connect(waveFilter);
        waveFilter.connect(waveGain);
        waveGain.connect(masterGain);
        waveNode.start();
        lfoNode.start();

        isPlaying = true;
        playWarmPadChord(chords[chordIdx % chords.length]);
        chordIdx++;
        chordTimer = setInterval(() => {
          playWarmPadChord(chords[chordIdx % chords.length]);
          chordIdx++;
        }, 3800);

        updateUI();
      }

      function stopBgm() {
        if (!isPlaying) return;
        clearInterval(chordTimer);
        try { waveNode && waveNode.stop(); lfoNode && lfoNode.stop(); } catch (_) {}
        if (masterGain && ctx) {
          try { masterGain.disconnect(); } catch (_) {}
        }
        isPlaying = false;
        updateUI();
      }

      function autoStartOnFirstGesture() {
        if (!userMuted && !isPlaying) startBgm();
      }

      function toggle() {
        if (isPlaying) {
          userMuted = true;
          stopBgm();
        } else {
          userMuted = false;
          startBgm();
        }
        return isPlaying;
      }

      function playDropSfx() {
        const c = ensureCtx();
        if (!c) return;
        const osc = c.createOscillator(), gain = c.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(980, c.currentTime + 0.11);
        gain.gain.setValueAtTime(0.08, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.14);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(); osc.stop(c.currentTime + 0.15);
      }

      function updateUI() {
        const btn = document.getElementById("audio-toggle"), icon = document.getElementById("audio-icon");
        if (!btn || !icon) return;
        btn.classList.toggle("is-playing", isPlaying);
        icon.textContent = isPlaying ? "🎵" : "🔇";
      }

      return { toggle, autoStartOnFirstGesture, playDropSfx, isPlaying: () => isPlaying };
    })();

    /* ========= 4. P2 用眼自测 ========= */
    window.HAILU_P2 = function (app) {
      const cfg = window.HAILU_CONFIG.p2;
      const quizBody = document.getElementById("quiz-body");
      const progressEl = document.getElementById("quiz-progress");
      const ipStage = document.getElementById("p2-ip-stage");

      document.getElementById("p2-title").textContent = cfg.title;
      document.getElementById("p2-subtitle").textContent = cfg.subtitle;
      ipStage.innerHTML = `<div style="width:160px;height:98px">${window.HAILU_SVG.eyeIP("tired")}</div>`;

      setInterval(() => {
        if (app.getCurrentPage() !== 2) return;
        ipStage.style.transition = "transform 260ms ease";
        ipStage.style.transform = "scaleY(0.18)";
        setTimeout(() => { ipStage.style.transform = "scaleY(1)"; }, 220);
      }, 4000);

      let stepIndex = 0;
      const answers = { q1: 0, q2: 0, q3: [] };

      function renderQuestion() {
        const q = cfg.quizData[stepIndex];
        progressEl.innerHTML = cfg.quizData
          .map((_, idx) => `<div class="quiz-step-dot ${idx < stepIndex ? "is-done" : idx === stepIndex ? "is-current" : ""}"></div>`)
          .join("");
        const optsHtml = q.options
          .map((opt, idx) => `<button class="quiz-opt-btn ${q.type === "multi" && answers.q3.includes(opt.label) ? "is-selected" : ""}" data-idx="${idx}">${opt.label}</button>`)
          .join("");
        const footerHtml = q.type === "multi" ? `<button class="btn-coral" id="quiz-submit-btn" style="width:100%;margin-top:10px;">查看结果</button>` : "";

        quizBody.innerHTML = `<h3 class="quiz-q-title">${q.question}</h3><div class="quiz-options">${optsHtml}</div>${footerHtml}`;

        quizBody.querySelectorAll(".quiz-opt-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const rect = btn.getBoundingClientRect(), r = document.createElement("span");
            r.className = "quiz-ripple";
            const size = Math.max(rect.width, rect.height) * 0.4;
            r.style.width = r.style.height = `${size}px`;
            r.style.left = `${(e.clientX || rect.left + rect.width / 2) - rect.left - size / 2}px`;
            r.style.top = `${(e.clientY || rect.top + rect.height / 2) - rect.top - size / 2}px`;
            btn.appendChild(r); setTimeout(() => r.remove(), 550);
            window.HAILU_AUDIO.playDropSfx();

            const opt = q.options[Number(btn.dataset.idx)];
            if (q.type === "single") {
              quizBody.querySelectorAll(".quiz-opt-btn").forEach((b) => b.classList.remove("is-selected"));
              btn.classList.add("is-selected");
              answers[q.id] = opt.score;
              setTimeout(() => { if (stepIndex < cfg.quizData.length - 1) { stepIndex++; renderQuestion(); } }, 340);
            } else {
              btn.classList.toggle("is-selected");
              answers.q3 = answers.q3.includes(opt.label) ? answers.q3.filter((i) => i !== opt.label) : [...answers.q3, opt.label];
            }
          });
        });

        const submitBtn = document.getElementById("quiz-submit-btn");
        if (submitBtn) submitBtn.addEventListener("click", showResult);
      }

      function showResult() {
        const total = answers.q1 + answers.q2;
        const res = total <= 3 ? cfg.results.low : total >= 7 ? cfg.results.high : cfg.results.mid;
        app.setPageUnlocked(2, true);
        app.trackEvent("quiz_complete", { score: total, level: res.level, symptoms: answers.q3 });
        app.openModal(`
          <div class="modal-preline">${cfg.results.preline}</div>
          <h3 class="modal-title">你的用眼负荷等级：<span class="level-coral">${res.level}</span></h3>
          <p class="modal-body-text">${res.copy}</p>
          <div class="modal-science-box">${cfg.results.scienceFooter}</div>
          <div class="modal-btn-row">
            <button class="btn-ghost" id="btn-retest">重新测一次</button>
            <button class="btn-coral" id="btn-go-p3">继续向下探索</button>
          </div>
        `);
        document.getElementById("btn-retest").onclick = () => { app.closeModal(); resetQuiz(); };
        document.getElementById("btn-go-p3").onclick = () => { app.closeModal(); app.goToPage(3); };
      }

      function resetQuiz() { stepIndex = 0; answers.q1 = 0; answers.q2 = 0; answers.q3 = []; renderQuestion(); }
      renderQuestion();
      return { reset: resetQuiz };
    };

    /* ========= 5. P3 撕开屏幕（已删除滚动文字彩蛋，缩小屏幕区，放大下方文字区，太阳云朵下移，海面下方补充下滑UI） ========= */
    window.HAILU_P3 = function (app) {
      const cfg = window.HAILU_CONFIG.p3;
      const peelStack = document.getElementById("p3-peel-stack");

      document.getElementById("p3-comic-strip").innerHTML = cfg.comics.map((c) => `<div class="p3-comic-panel">${window.HAILU_SVG.comicIcon(c.scene)}<div>${c.label}</div></div>`).join("");
      document.getElementById("p3-poem").innerHTML = cfg.poemLines.map((l) => `<div>${l}</div>`).join("");

      seaDownUi.addEventListener("click", () => app.goToPage(4));

      let peeledCount = 0;
      const totalLayers = cfg.peelLayers.length;

      function renderLayers() {
        peelStack.innerHTML = "";
        peeledCount = 0;
        darkStage.style.opacity = "1";
        seaReveal.classList.remove("is-revealed");
        seaReveal.style.opacity = "0";
        seaDownUi.classList.remove("is-visible");
        app.setPageUnlocked(3, false);

        [...cfg.peelLayers].reverse().forEach((layer, revIdx) => {
          const logicalIndex = totalLayers - 1 - revIdx;
          const el = document.createElement("div");
          el.className = "peel-layer";
          el.style.transform = `translateY(${logicalIndex * 5}px) scale(${1 - logicalIndex * 0.03})`;
          el.innerHTML = `
            <div style="font-size:11.5px;color:#9FB6C8;font-weight:700">${layer.tag}</div>
            <div style="text-align:center">
              <div style="font-size:28px;margin-bottom:4px">${logicalIndex === 0 ? "📱" : logicalIndex === 1 ? "💻" : "🌙"}</div>
              <div style="font-size:14.5px;font-weight:800">${layer.headline}</div>
            </div>
            <div class="peel-gesture-pill">↑ ${layer.hint}</div>
          `;
          let startY = 0, startTime = 0, currentDy = 0, dragging = false;
          el.addEventListener("pointerdown", (e) => {
            dragging = true; startY = e.clientY; startTime = Date.now(); currentDy = 0;
            el.setPointerCapture(e.pointerId); el.style.transition = "none";
          });
          el.addEventListener("pointermove", (e) => {
            if (!dragging) return;
            const dy = Math.min(0, e.clientY - startY); currentDy = dy;
            const p = Math.min(1, Math.abs(dy) / 140);
            el.style.transform = `translateY(${dy}px) rotate(${dy * 0.03}deg) scale(${1 - p * 0.08})`;
            el.style.opacity = String(1 - p * 0.35);
          });
          const endDrag = () => {
            if (!dragging) return;
            dragging = false;
            const velocity = Math.abs(currentDy) / Math.max(16, Date.now() - startTime);
            if (Math.abs(currentDy) > 70 || velocity > 0.45) {
              window.HAILU_AUDIO.playDropSfx();
              el.classList.add("is-jitter");
              setTimeout(() => {
                el.style.transition = "transform 460ms var(--ease-soft), opacity 420ms";
                el.style.transform = "translateY(-135%) rotate(-8deg) scale(0.76)";
                el.style.opacity = "0"; el.style.pointerEvents = "none";
                peeledCount++;
                if (peeledCount >= totalLayers) {
                  darkStage.style.opacity = "0";
                  seaReveal.classList.add("is-revealed");
                  seaReveal.style.opacity = "1";
                  app.setPageUnlocked(3, true);
                  seaDownUi.classList.add("is-visible");
                }
              }, 150);
            } else {
              el.style.transition = "transform 300ms var(--ease-bounce), opacity 300ms";
              el.style.transform = "translateY(0) scale(1)"; el.style.opacity = "1";
            }
          };
          el.addEventListener("pointerup", endDrag);
          el.addEventListener("pointercancel", endDrag);
          peelStack.appendChild(el);
        });
      }
      renderLayers();
      return { reset: renderLayers };
    };

    /* ========= 6. P5 拖拽水滴 ========= */
    window.HAILU_P5 = function (app) {
      const cfg = window.HAILU_CONFIG.p5;
      const pageEl = document.getElementById("page-5");
      const subEl = document.getElementById("p5-sub");
      const dropsZone = document.getElementById("p5-drops-zone");
      const slotsGrid = document.getElementById("p5-slots-grid");
      const swipeHint = document.getElementById("p5-swipe-hint");
      const bottleRevealWrap = document.getElementById("p5-bottle-reveal-wrap");
      const centerBottle = document.getElementById("p5-center-bottle");

      document.getElementById("p5-title").textContent = cfg.title;
      centerBottle.addEventListener("click", (e) => {
        e.stopPropagation();
        window.HAILU_AUDIO.playDropSfx();
        app.showToast(window.HAILU_CONFIG.bottleMessages[5]);
      });

      let filledState = { heritage: false, safety: false, gentle: false };
      const pos = [{ left: "10%", top: "24px" }, { left: "41%", top: "12px" }, { left: "72%", top: "26px" }];

      function findHitSlot(x, y) {
        for (const slot of slotsGrid.querySelectorAll(".p5-slot:not(.is-filled)")) {
          const r = slot.getBoundingClientRect();
          if (x >= r.left - 14 && x <= r.right + 14 && y >= r.top - 14 && y <= r.bottom + 14) return slot;
        }
        return null;
      }

      function renderP5() {
        filledState = { heritage: false, safety: false, gentle: false };
        pageEl.classList.remove("is-morning");
        subEl.textContent = cfg.sub;
        dropsZone.style.opacity = "1";
        dropsZone.innerHTML = "";
        bottleRevealWrap.classList.remove("is-shown");
        swipeHint.classList.remove("is-visible");
        app.setPageUnlocked(5, false);

        slotsGrid.innerHTML = cfg.slots.map((s) => `<div class="p5-slot" data-slot="${s.key}"><span class="slot-empty-hint">${s.slotLabel}</span></div>`).join("");

        cfg.drops.forEach((drop, idx) => {
          const el = document.createElement("div");
          el.className = "drag-drop-item floating-soft";
          el.style.left = pos[idx].left; el.style.top = pos[idx].top;
          el.innerHTML = window.HAILU_SVG.waterDrop(drop.icon, drop.label);

          let startX = 0, startY = 0, dragging = false;
          el.addEventListener("pointerdown", (e) => {
            if (el.classList.contains("is-used")) return;
            dragging = true; startX = e.clientX; startY = e.clientY;
            el.setPointerCapture(e.pointerId);
            el.classList.remove("floating-soft"); el.classList.add("is-dragging");
            el.style.transition = "none";
          });
          el.addEventListener("pointermove", (e) => {
            if (!dragging) return;
            el.style.transform = `translate(${e.clientX - startX}px, ${e.clientY - startY}px) scale(1.14)`;
            slotsGrid.querySelectorAll(".p5-slot").forEach((s) => s.classList.remove("is-hover"));
            const hit = findHitSlot(e.clientX, e.clientY);
            if (hit) hit.classList.add("is-hover");
          });
          const onEnd = (e) => {
            if (!dragging) return;
            dragging = false; el.classList.remove("is-dragging");
            slotsGrid.querySelectorAll(".p5-slot").forEach((s) => s.classList.remove("is-hover"));
            const hit = findHitSlot(e.clientX, e.clientY);
            if (hit && hit.dataset.slot === drop.slotKey) {
              window.HAILU_AUDIO.playDropSfx();
              el.classList.add("is-used"); filledState[drop.slotKey] = true;
              const sc = cfg.slots.find((s) => s.key === drop.slotKey);
              let flipped = false;
              hit.classList.add("is-filled");
              const renderFace = () => {
                hit.innerHTML = flipped
                  ? `<div class="slot-card-content"><div class="slot-card-title"><span>✨ ${sc.title}</span><span style="font-size:10px;color:#F0922E">点击翻回</span></div><p class="slot-card-desc" style="font-weight:700;color:#0E87C4">${sc.summary}</p></div>`
                  : `<div class="slot-card-content"><div class="slot-card-title"><span>${drop.icon} ${sc.title}</span><span style="font-size:10px;color:#8A94A0">点击翻面</span></div><p class="slot-card-desc">${sc.desc}</p></div>`;
              };
              renderFace();
              hit.addEventListener("click", () => { flipped = !flipped; renderFace(); });

              if (Object.values(filledState).every(Boolean)) {
                setTimeout(() => {
                  pageEl.classList.add("is-morning");
                  dropsZone.style.opacity = "0";
                  subEl.textContent = cfg.subDone;
                  bottleRevealWrap.classList.add("is-shown");
                  app.setPageUnlocked(5, true);
                  swipeHint.classList.add("is-visible");
                }, 350);
              }
            } else {
              if (hit) app.showToast(`这颗「${drop.label}」请拖到对应的【${drop.label}】卡槽哦～`);
              el.style.transition = "transform 380ms var(--ease-bounce)";
              el.style.transform = "translate(0, 0) scale(1)";
              setTimeout(() => el.classList.add("floating-soft"), 380);
            }
          };
          el.addEventListener("pointerup", onEnd);
          el.addEventListener("pointercancel", onEnd);
          dropsZone.appendChild(el);
        });
      }
      renderP5();
      return { reset: renderP5 };
    };
